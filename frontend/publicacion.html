<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicación - Cup26</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="publicacion.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="countdown-banner">
            <span>🏆 WORLD CUP 2026 IN 232:12:12:12 🏆</span>
        </div>
        <div class="top-bar">
            <a href="home.html" style="text-decoration: none; color: inherit;">
                <h2 class="logo">Cup26</h2>
            </a>
            <div class="top-bar-icons">
                <i class="fa-solid fa-search"></i>

                <!-- Contenedor del menú -->
                <div class="user-menu-container">
                    <!-- El ícono de perfil que abre el menú -->
                    <img id="user-avatar-top" src="https://static.vecteezy.com/system/resources/previews/009/292/244/non_2x/default-avatar-icon-of-social-media-user-vector.jpg" alt="User Avatar" class="profile-avatar-icon">

                    <!-- El menú desplegable (oculto por CSS) -->
                    <div id="user-dropdown-menu" class="dropdown-menu">
                        <a href="perfil.html" class="dropdown-item">
                            <i class="fa-solid fa-user"></i>
                            <span>Ver Perfil</span>
                        </a>
                        <div class="dropdown-divider"></div>
                        <div id="logout-btn" class="dropdown-item">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            <span>Cerrar Sesión</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <main id="post-detail-container" class="feed-column">
            <!-- La publicación detallada se cargará aquí -->
        </main>
    </div>

    <script src="nav.js"></script>
    <script src="publicacion.js"></script>
</body>
</html>
