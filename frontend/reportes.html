<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Cup26</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;900&display=swap" rel="stylesheet">
    <style>
        .reports-container {
            max-width: 1100px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 30px;
        }
        .report-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .report-card h3 {
            color: #4a00e0;
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 10px;
            margin-top: 0;
        }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: #666; padding: 10px; font-size: 0.9rem; }
        td { padding: 10px; border-bottom: 1px solid #eee; color: #333; }
        .rank-num { font-weight: bold; color: #8e2de2; }
        .user-cell { display: flex; align-items: center; gap: 10px; }
        .mini-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
    </style>
</head>
<body>
    <header>
        <div class="countdown-banner"><span>🏆 ESTADÍSTICAS DEL MUNDIAL 🏆</span></div>
        <div class="top-bar">
            <a href="home.html" style="text-decoration: none; color: inherit;"><h2 class="logo">Cup26</h2></a>
            <div class="top-bar-icons">
                <a href="home.html" style="font-weight: bold; text-decoration: none; color: #666;">Volver al Inicio</a>
            </div>
        </div>
    </header>

    <div class="reports-container">
        
        <div class="report-card">
            <h3>🧠 Top "Sabios" (Más Aciertos)</h3>
            <table>
                <thead><tr><th>#</th><th>Usuario</th><th>Aciertos</th></tr></thead>
                <tbody id="table-top-users"><tr><td colspan="3">Cargando...</td></tr></tbody>
            </table>
        </div>

        <div class="report-card">
            <h3>🔥 Encuestas en Tendencia</h3>
            <table>
                <thead><tr><th>#</th><th>Pregunta</th><th>Votos Totales</th></tr></thead>
                <tbody id="table-top-votes"><tr><td colspan="3">Cargando...</td></tr></tbody>
            </table>
        </div>

        <div class="report-card">
            <h3>💬 Temas más Discutidos</h3>
            <table>
                <thead><tr><th>#</th><th>Pregunta</th><th>Comentarios</th></tr></thead>
                <tbody id="table-top-comments"><tr><td colspan="3">Cargando...</td></tr></tbody>
            </table>
        </div>

        <div class="report-card">
            <h3>💎 Usuarios Más Valiosos</h3>
            <table>
                <thead><tr><th>#</th><th>Usuario</th><th>Items</th><th>FanCoins</th></tr></thead>
                <tbody id="table-richest"><tr><td colspan="4">Cargando...</td></tr></tbody>
            </table>
        </div>

    </div>

    <script>
        async function loadReports() {
            const endpoints = [
                { url: '/api/reports/top-users', id: 'table-top-users', 
                row: (d, i) => `<td><span class="rank-num">${i+1}</span></td><td class="user-cell"><img src="${d.foto_perfil_url ? ''+d.foto_perfil_url : 'https://i.pravatar.cc/150'}" class="mini-avatar"> ${d.nombre_usuario}</td><td>${d.aciertos}</td>` },
                
                { url: '/api/reports/top-posts-votes', id: 'table-top-votes', 
                row: (d, i) => `<td>${i+1}</td><td>${d.texto_pregunta.substring(0, 30)}...</td><td><strong>${d.total_votos}</strong></td>` },

                { url: '/api/reports/top-posts-comments', id: 'table-top-comments', 
                row: (d, i) => `<td>${i+1}</td><td>${d.texto_pregunta.substring(0, 30)}...</td><td><strong>${d.total_comentarios}</strong></td>` },

                { url: '/api/reports/richest-users', id: 'table-richest', 
                row: (d, i) => `<td>${i+1}</td><td>${d.nombre_usuario}</td><td>${d.items_comprados}</td><td>💰 ${d.fan_coins}</td>` }
            ];

            for (const item of endpoints) {
                try {
                    const res = await fetch('' + item.url);
                    const data = await res.json();
                    const tbody = document.getElementById(item.id);
                    
                    if (data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4">No hay datos suficientes.</td></tr>';
                    } else {
                        tbody.innerHTML = data.map((d, index) => `<tr>${item.row(d, index)}</tr>`).join('');
                    }
                } catch (e) {
                    console.error(e);
                }
            }
        }
        loadReports();
    </script>
</body>
</html>
