<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario - Cup26</title>
    <!-- Los mismos enlaces que antes, pero asegúrate de que el CSS de perfil esté presente -->
    <link rel="stylesheet" href="home.css"> 
    <link rel="stylesheet" href="perfil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="countdown-banner">
            <div id="countdown-text" class="ticker-content">Cargando tiempo para el Mundial...</div>
        </div>
    <div class="top-bar">
        <a href="home.html" style="text-decoration: none; color: inherit;">
            <h2 class="logo">Cup26</h2>
        </a>
    <div class="top-bar-icons">
                <div class="search-container">
                    <i class="fa-solid fa-search search-icon"></i>
                    <input type="search" id="search-input" placeholder="Buscar encuestas...">
                    <div id="search-results" class="search-results-container"></div>
                </div>

                <div class="user-menu-container">
                    <img id="user-avatar-top" src="https://static.vecteezy.com/system/resources/previews/009/292/244/non_2x/default-avatar-icon-of-social-media-user-vector.jpg" alt="User Avatar" class="profile-avatar-icon">

                    <div id="user-dropdown-menu" class="dropdown-menu">
                        <a href="perfil.html" class="dropdown-item">
                            <i class="fa-solid fa-user"></i>
                            <span>Ver Perfil</span>
                        </a>
                        <div class="dropdown-divider"></div>
                        <div id="logout-btn" class="dropdown-item">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            <span>Cerrar Sesión</span>
                        </div>
                    </div>
                </div>
            </div>
    </div>
</header>

    <div class="main-container">

        <main id="profile-page-container" class="feed-column">
        </main>
    </div>

    <div id="edit-profile-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <span class="close-modal-btn">&times;</span>
        <h2>Editar Perfil</h2>
        <form id="editProfileForm">
            <label class="edit-label">Foto de Perfil</label>
            <div class="avatar-preview-container">
                <img id="avatar-preview" src="" alt="Vista previa del avatar">
            </div>
            <div class="file-input-wrapper">
                <button type="button" class="btn-upload">
                    <i class="fa-solid fa-upload"></i> Cambiar imagen
                </button>
                <input type="file" id="edit-avatar-file" accept="image/*">
            </div>

            <label class="edit-label">Foto de Portada</label>
            <div class="cover-preview-container">
                <img id="cover-preview" src="" alt="Vista previa de la portada">
            </div>
            <div class="file-input-wrapper">
                <button type="button" class="btn-upload">
                    <i class="fa-solid fa-upload"></i> Cambiar portada
                </button>
                <input type="file" id="edit-cover-file" accept="image/*">
            </div>

            <div class="input-group">
                <input type="text" id="edit-username" required>
                <label for="edit-username">Nombre de Usuario</label>
            </div>
            
            <button type="submit" class="btn-main">Guardar Cambios</button>
            <p id="edit-modal-message"></p>

            <div style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; text-align: center;">
                <button type="button" id="btn-delete-account" style="background: transparent; border: 1px solid #dc3545; color: #dc3545; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;">
                    <i class="fa-solid fa-trash"></i> Eliminar Cuenta
                </button>
            </div>
        </form>
    </div>
</div>

    <script src="nav.js"></script>
    <script src="perfil.js"></script>
</body>
</html>
