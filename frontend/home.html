<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Cup26</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="countdown-banner">
            <span>🏆 WORLD CUP 2026 IN 232:12:12:12 🏆</span>
        </div>
        <div class="top-bar">
            <!-- AQUÍ ESTÁ EL CAMBIO -->
            <a href="home.html" style="text-decoration: none; color: inherit;">
                <h2 class="logo">Cup26</h2>
            </a>
            <div class="top-bar-icons">
                <i class="fa-solid fa-search"></i>

                <div class="user-menu-container">
                    <img id="user-avatar-top" src="https://static.vecteezy.com/system/resources/previews/009/292/244/non_2x/default-avatar-icon-of-social-media-user-vector.jpg" alt="User Avatar" class="profile-avatar-icon">

                    <div id="user-dropdown-menu" class="dropdown-menu">
                        <a href="perfil.html" class="dropdown-item">
                            <i class="fa-solid fa-user"></i>
                            <span>Ver Perfil</span>
                        </a>
                        <div class="dropdown-divider"></div>
                        <div id="logout-btn" class="dropdown-item">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            <span>Cerrar Sesión</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <main class="feed-column" id="feed-container">
        </main>

        <aside class="sidebar-column">
            <div class="sidebar-widget">
                <h3>Trending Polls</h3>
                <div class="trending-users">
                    <img src="https://i.pravatar.cc/40?img=1" alt="User" class="trending-avatar">
                    <img src="https://i.pravatar.cc/40?img=2" alt="User" class="trending-avatar">
                    <img src="https://i.pravatar.cc/40?img=3" alt="User" class="trending-avatar">
                    <img src="https://i.pravatar.cc/40?img=4" alt="User" class="trending-avatar">
                    <img src="https://i.pravatar.cc/40?img=5" alt="User" class="trending-avatar">
                    <img src="https://i.pravatar.cc/40?img=6" alt="User" class="trending-avatar">
                </div>
            </div>
            <button id="create-post-btn" class="btn-create-post">
                <i class="fa-solid fa-plus"></i> Create new post
            </button>
        </aside>
    </div>

    <div id="create-post-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-modal-btn">&times;</span>
            <h2>Create a poll</h2>
            <form id="createPostForm">
                <textarea id="post-question" placeholder="Ask a question..." required></textarea>
                
                <div class="poll-type-selector">
                    <label for="poll-type">Tipo de encuesta:</label>
                    <select id="poll-type">
                        <option value="text">Solo Texto</option>
                        <option value="image">Con Imágenes</option>
                    </select>
                </div>

                <div id="options-container"></div>
                
                <button type="button" id="add-option-btn" class="btn-add-option">Añadir opción</button>
                <button type="submit" class="btn-main">Publicar</button>
                <p id="modal-message"></p>
            </form>
        </div>
    </div>

    <script src="nav.js"></script>
    <script src="home.js"></script>
</body>
</html>
